<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一纸禅 · 三方向打样</title>
<style>
  body { margin:0; font-family:"PingFang SC","Noto Sans SC",sans-serif; background:#e8ece9; color:#1a2320; }
  header { padding:20px 24px 8px; }
  header h1 { font-size:18px; margin:0 0 6px; }
  header p { margin:0; font-size:13px; color:#4b5c58; line-height:1.5; }
  .row { display:grid; grid-template-columns:repeat(3, minmax(240px, 1fr)); gap:16px; padding:16px 20px 40px; }
  .card { background:#fff; border-radius:12px; padding:12px; box-shadow:0 8px 24px rgba(0,0,0,.08); }
  .card h2 { font-size:14px; margin:0 0 4px; }
  .card .tag { font-size:12px; color:#64748b; margin:0 0 10px; line-height:1.4; }
  iframe { width:100%; aspect-ratio:1/2; border:0; background:#ddd; border-radius:8px; }
  .card a { display:inline-block; margin-top:8px; font-size:13px; font-weight:700; color:#2563eb; }
  @media (max-width:960px) { .row { grid-template-columns:1fr; max-width:420px; margin:0 auto; } }
</style>
</head>
<body>
  <header>
    <h1>看着选一版，再说深化</h1>
    <p>文案同源（/apps）。A 安静留白 · B 瑞士网格 · C 信息图密度。均为打样，不升默认外发。</p>
  </header>
  <div class="row">
    <article class="card">
      <h2>A · 留白构图</h2>
      <p class="tag">3 米外一句；1 米内三个词级锚点。原研哉「间」。</p>
      <iframe title="A" src="./trinity-poster-100x200-zh-zen.html"></iframe>
      <a href="./trinity-poster-100x200-zh-zen.html">打开全页</a>
    </article>
    <article class="card">
      <h2>B · 瑞士网格</h2>
      <p class="tag">发丝线 + 极端字号。五条能力短句上墙。</p>
      <iframe title="B" src="./trinity-poster-100x200-zh-grid.html"></iframe>
      <a href="./trinity-poster-100x200-zh-grid.html">打开全页</a>
    </article>
    <article class="card">
      <h2>C · 信息图</h2>
      <p class="tag">标题即结论。计量三格 + 编号五点。</p>
      <iframe title="C" src="./trinity-poster-100x200-zh-dense.html"></iframe>
      <a href="./trinity-poster-100x200-zh-dense.html">打开全页</a>
    </article>
  </div>
</body>
</html>
